  newsletter_content:
    headline: NLP for Living Systematic Review in Psychedelic Therapy
    summary: The paper presents a method to automate the synthesis and updating of
      evidence in the field of psychedelic therapy for psychiatric disorders. By utilizing
      natural language processing (NLP) techniques, including large language models,
      the study aims to automate the classification of studies and extraction of relevant
      data. This approach facilitates real-time evidence synthesis, ensuring that
      the most current information is readily accessible to clinicians and researchers.
      The outcomes will be available in an online repository, providing a comprehensive
      resource for evidence-based information on psychedelic therapy.
    category: Methodology
    models: []
