- id: https://openalex.org/W7104365500
  title: Protocol for Prospective Evaluation of Screening Algorithms integrated in
    NeutrinoReview
  source: openalex
  doi: https://doi.org/10.5281/zenodo.17513215
  oa_status: {}
  include: true
  newsletter_content:
    headline: Evaluation of LLM-Based Screening in NeutrinoReview
    summary: This paper presents a protocol for the prospective evaluation of LLM-based
      screening algorithms integrated into the NeutrinoReview web application. The
      study focuses on two algorithms, 5-Tier and CAL-X, which leverage LLMs to automate
      the screening phase of systematic reviews, a traditionally labor-intensive process.
      Preliminary results indicate significant workload reductions, with the LLaMA
      3.1-8B model showing promising performance in prioritizing high-sensitivity
      studies. The evaluation aims to assess the algorithms' effectiveness in real-world
      settings, addressing potential data contamination and representativeness issues.
    category: Methodology
    models:
    - LLaMA 3.1-8B
    - GPT-4
    relevance_score: 9
- id: https://openalex.org/W7104389363
  title: Protocol for Prospective Evaluation of Screening Algorithms integrated in
    NeutrinoReview
  source: openalex
  doi: https://doi.org/10.5281/zenodo.17554629
  oa_status: {}
  include: true
  newsletter_content:
    headline: Prospective Evaluation of NeutrinoReview Screening Algorithms
    summary: This paper presents a protocol for the prospective evaluation of LLM-based
      screening algorithms integrated into NeutrinoReview, a web application designed
      to automate the screening phase of systematic reviews. The study evaluates two
      algorithms, 5-Tier and CAL-X, which leverage LLMs to prioritize high-sensitivity
      pre-filtration of studies, aiming to reduce the workload while maintaining accuracy.
      Preliminary results indicate workload reductions between 36% and 72%, with further
      assessments pending human consensus. The LLM used in this study is LLaMA 3.1-8B,
      hosted at CERN.
    category: Methodology
    models:
    - LLaMA 3.1-8B
    - GPT-4
    relevance_score: 9
- id: https://openalex.org/W7116955964
  title: 'Antidepressant and Antipsychotic Drug Use and Cancer Risk: Protocol for
    an Overview of Systematic Reviews and Meta-Analyses'
  source: openalex
  doi: https://doi.org/10.2196/78596
  oa_status:
    is_oa: true
    oa_status: gold
    url: https://doi.org/10.2196/78596
    license: cc-by
  include: true
  newsletter_content:
    headline: Protocol for Drug Use and Cancer Risk Review
    summary: This paper outlines a protocol for an overview of systematic reviews
      and meta-analyses assessing the relationship between antidepressant and antipsychotic
      drug use and cancer risk. The study aims to evaluate whether these medications
      influence cancer incidence and mortality. The protocol includes the use of GPT-4o,
      a large language model, to assist in data extraction and screening tasks, potentially
      accelerating the review process. The performance of GPT-4o will be validated
      against human reviewers to ensure accuracy.
    category: Methodology
    models:
    - GPT-4o
    relevance_score: 8
- id: https://openalex.org/W7116708426
  title: Streamlining evidence based clinical recommendations with large language
    models
  source: openalex
  doi: https://doi.org/10.1038/s41746-025-02273-y
  oa_status:
    is_oa: true
    oa_status: gold
    url: https://doi.org/10.1038/s41746-025-02273-y
    license: cc-by-nc-nd
  include: true
  newsletter_content:
    headline: LLM System for Automating Clinical Recommendations
    summary: The study introduces 'Quicker', an LLM-powered system designed to automate
      the synthesis and generation of clinical recommendations following standard
      guideline development workflows. Quicker provides an end-to-end pipeline that
      supports customized decision-making through integrated tools and interactive
      interfaces. Evaluated using the Q2CRBench-3 benchmark, Quicker demonstrated
      precise question decomposition, expert-aligned retrieval, and near-comprehensive
      screening, improving the accuracy and comprehensiveness of extracted data compared
      to clinician-written recommendations.
    category: New Tool/App
    models: []
    relevance_score: 8
- id: https://openalex.org/W7116769648
  title: 'ResearchLens: An AI-Powered Desktop Environment for Qualitative Document
    Analysis and Literature Synthesis'
  source: openalex
  doi: https://doi.org/10.5281/zenodo.18009145
  oa_status: {}
  include: true
  newsletter_content:
    headline: 'ResearchLens: AI Tool for Qualitative Document Analysis'
    summary: ResearchLens is an open-source desktop application designed to assist
      researchers in qualitative document analysis and literature review workflows.
      It integrates Google Gemini generative AI models to enable semantic and contextual
      analysis of local research documents. The tool supports user-guided summarization,
      thematic extraction, and comparative analysis across multiple documents, facilitating
      systematic coding and synthesis while reducing manual effort. By processing
      documents locally, it ensures data sovereignty and maintains methodological
      control and reproducibility.
    category: New Tool/App
    models:
    - Google Gemini
    relevance_score: 8
- id: https://openalex.org/W7117084829
  title: 'PsyNamic: A living systematic review of psychedelic therapy in psychiatric
    disorders'
  source: openalex
  doi: null
  oa_status: null
