- id: https://openalex.org/W7116587418
  title: Enhancing study selection in nutrition systematic reviews using large language
    models
  source: openalex
  doi: null
  oa_status: null
  include: true
  newsletter_content:
    headline: LLMs for Study Selection in Nutrition Reviews
    summary: This paper evaluates the integration and performance of commonly used
      large language models (LLMs) in the study selection process of nutrition systematic
      reviews. The study aims to assess how effectively LLMs can assist in screening
      and selecting relevant studies from a large sample. The results provide insights
      into the potential of LLMs to streamline the study selection phase, which is
      a critical step in conducting systematic reviews.
    category: Methodology
    models: []
    relevance_score: 8
- id: 2512.20022v1
  title: 'LLM-Assisted Abstract Screening with OLIVER: Evaluating Calibration and
    Single-Model vs. Actor-Critic Configurations in Literature Reviews'
  source: arxiv
  doi: null
  oa_status: null
  include: true
  newsletter_content:
    headline: 'OLIVER: LLM-Based Abstract Screening Tool Evaluation'
    summary: The paper introduces OLIVER, an open-source pipeline designed to enhance
      abstract screening in systematic reviews using large language models (LLMs).
      It evaluates the performance of various LLMs across two non-Cochrane reviews,
      focusing on accuracy, AUC, and calibration metrics. The study highlights the
      limitations of single-model configurations, particularly in calibration, and
      demonstrates that an actor-critic framework can improve classification quality
      and confidence reliability, making large-scale screening more efficient and
      cost-effective.
    category: New Tool/App
    models: []
    relevance_score: 9
